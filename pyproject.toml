[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-knowledge-base"
version = "0.1.0"
description = "企业级 AI 知识库问答 MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.8",
    "fastapi>=0.115,<1",
    "firecrawl-anydoc==0.1.8",
    "httpx>=0.27,<1",
    "pdf-inspector==1.14.1",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.31,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.basedpyright]
include = ["app"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]
