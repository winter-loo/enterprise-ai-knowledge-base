<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业知识库问答</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf5;background:#101318}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#233047 0,#101318 45%);min-height:100vh}.shell{max-width:1180px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.eyebrow{color:#7dd3fc;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700}.top h1{margin:8px 0 0;font-size:clamp(28px,5vw,46px);letter-spacing:-.04em}.muted{color:#9ba8b8}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:rgba(22,28,38,.88);border:1px solid #2b3545;border-radius:18px;padding:18px;box-shadow:0 18px 60px #0003}.card h2{font-size:16px;margin:0 0 14px}.stack{display:grid;gap:12px}label{display:grid;gap:6px;color:#aebaca;font-size:13px}input,select,textarea,button{font:inherit;border-radius:10px;border:1px solid #344155;background:#141a24;color:#edf3fb;padding:10px 12px}textarea{resize:vertical;min-height:100px}button{background:#38bdf8;color:#062033;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.drop{border:1px dashed #47617e;padding:16px;border-radius:12px}.drop input{width:100%;padding:0;border:0;background:none}.status{font-size:13px;min-height:20px;color:#9ba8b8}.chat{min-height:430px;display:flex;flex-direction:column;gap:14px}.answer{white-space:pre-wrap;line-height:1.7;background:#182333;border-radius:14px;padding:16px}.question{color:#7dd3fc;font-weight:700}.sources{display:grid;gap:8px;margin-top:12px}.source{border-left:3px solid #38bdf8;padding:8px 10px;background:#121924;color:#bdc8d6;font-size:13px}.empty{display:grid;place-items:center;flex:1;color:#76849a;min-height:300px;text-align:center}.meta{font-size:12px;color:#8290a3;margin-top:8px}.docs{margin-top:18px}.doc{display:flex;justify-content:space-between;border-top:1px solid #2a3442;padding:10px 0;font-size:13px}.pill{border-radius:99px;background:#173c4d;color:#7dd3fc;padding:3px 8px;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{display:block}.card{border-radius:14px}}
</style></head><body><main class="shell">
<header class="top"><div><div class="eyebrow">Enterprise RAG / MVP</div><h1>企业知识库问答</h1><div class="muted">上传内部资料，基于授权知识库获得可追溯回答。</div></div><div class="pill" id="health">连接检查中</div></header>
<section class="grid"><aside class="stack"><div class="card stack"><h2>上传知识</h2><label>知识库<select id="kb"></select></label><label>项目范围<select id="project"></select></label><label>部门权限<select id="department"><option value="general">通用资料</option><option value="engineering">研发</option><option value="hr">人事</option><option value="sales">销售</option></select></label><label>切片策略<select id="chunking"><option value="recursive">递归结构（推荐）</option><option value="fixed">固定窗口</option><option value="semantic">语义向量</option><option value="paragraph">标题段落</option></select></label><div class="drop"><input id="file" type="file" accept=".txt,.md,.csv,.json,.log,.html,.xml,.pdf,.docx,.pptx,.xlsx,.rtf,.epub"></div><button id="upload">上传并索引</button><div class="status" id="uploadStatus"></div></div><div class="card docs"><h2>已索引文档</h2><div id="docs" class="stack"></div></div></aside>
<section class="card chat"><div id="messages" class="empty">还没有问题。先上传一份文档，然后提问。</div><form id="askForm" class="stack"><textarea id="question" placeholder="例如：员工试用期最长多久？请说明依据。" required></textarea><button id="ask">查询知识库</button></form></section></section></main>
<script>
const $=s=>document.querySelector(s),esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;');let history=[];async function api(url,opt){const r=await fetch(url,opt),data=await r.json();if(!r.ok)throw new Error(data.detail||'请求失败');return data}
async function projects(){const rows=await api('/api/projects?kb_id='+encodeURIComponent($('#kb').value));$('#project').innerHTML=rows.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}
async function docs(){const rows=await api('/api/documents?kb_id='+encodeURIComponent($('#kb').value));$('#docs').innerHTML=rows.length?rows.map(d=>`<div class="doc"><span>${esc(d.filename)}<br><small class="muted">${d.chunk_count} 个片段 · ${esc(d.department)} · ${esc(d.chunking_strategy||'recursive')} · ${esc(d.parser||d.source_type)}${d.pdf_type?` · ${esc(d.pdf_type)}`:''}</small></span><span class="pill">${esc(d.status)}</span></div>`).join(''):'<div class="muted">暂无文档</div>'}
async function load(){try{const health=await api('/api/health');$('#health').textContent=health.status==='ok'?'服务正常':'服务异常';const kbs=await api('/api/knowledge-bases');$('#kb').innerHTML=kbs.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');await projects();await docs()}catch(e){$('#health').textContent=e.message}}
$('#kb').addEventListener('change',async()=>{await projects();await docs()});$('#upload').addEventListener('click',async()=>{const f=$('#file').files[0];if(!f)return $('#uploadStatus').textContent='请选择文件';const fd=new FormData();fd.append('file',f);fd.append('kb_id',$('#kb').value);fd.append('project_id',$('#project').value);fd.append('department',$('#department').value);fd.append('chunking_strategy',$('#chunking').value);$('#upload').disabled=true;$('#uploadStatus').textContent='正在索引…';try{const d=await api('/api/documents/upload',{method:'POST',body:fd});$('#uploadStatus').textContent=`已完成：${d.chunk_count} 个片段`;await docs()}catch(e){$('#uploadStatus').textContent=e.message}finally{$('#upload').disabled=false}});
$('#askForm').addEventListener('submit',async e=>{e.preventDefault();const q=$('#question').value.trim();if(!q)return;const box=$('#messages');if(box.classList.contains('empty')){box.classList.remove('empty');box.innerHTML=''}box.insertAdjacentHTML('beforeend',`<div class="question">Q · ${esc(q)}</div><div class="answer">检索中…</div>`);const answer=box.lastElementChild;$('#ask').disabled=true;try{const d=await api('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,kb_id:$('#kb').value,project_id:$('#project').value,department:$('#department').value,history})});answer.textContent=d.answer;answer.insertAdjacentHTML('beforeend',`<div class="meta">回答模式：${esc(d.answer_mode)} · 命中 ${d.retrieved} 个片段</div>`);if(d.citations.length)answer.insertAdjacentHTML('beforeend',`<div class="sources">${d.citations.map((s,i)=>`<div class="source"><b>[${i+1}] ${esc(s.filename)}</b><br>${esc(s.excerpt)}</div>`).join('')}</div>`);history.push({role:'user',content:q},{role:'assistant',content:d.answer})}catch(err){answer.textContent=err.message}finally{$('#ask').disabled=false;$('#question').value=''}});load();
</script></body></html>
